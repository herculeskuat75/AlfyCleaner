name: Universal APK Builder & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find, Extract, and Handle Nested ZIP
        run: |
          ZIP=""; BEST=0
          for z in ./*.zip; do
            [ -f "$z" ] || continue
            t=$(git log -1 --format=%ct -- "$z" 2>/dev/null || echo 0)
            [ -z "$t" ] && t=0
            if [ -z "$ZIP" ] || [ "$t" -gt "$BEST" ]; then ZIP="$z"; BEST="$t"; fi
          done

          if [ -z "$ZIP" ]; then echo "ZIP tidak ditemukan!"; exit 1; fi
          echo "Menggunakan ZIP: $ZIP"
          
          mkdir -p ./temp_project
          unzip -q "$ZIP" -d ./temp_project
          
          find ./temp_project -maxdepth 3 -name "*.zip" -exec unzip -q -o {} -d ./temp_project \;
          
          SETTINGS=$(find ./temp_project -name "settings.gradle*" | head -n 1)
          if [ -z "$SETTINGS" ]; then echo "settings.gradle tidak ditemukan!"; exit 1; fi
          PROJ_DIR=$(dirname "$SETTINGS")
          echo "PROJ_DIR=$PROJ_DIR" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clean and Build Debug & Release APK
        working-directory: ${{ env.PROJ_DIR }}
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            # Build dua-duanya sekaligus (Debug dan Release)
            ./gradlew clean assembleDebug assembleRelease
          else
            gradle clean assembleDebug assembleRelease
          fi

      - name: Find and Rename APKs
        run: |
          # Cari APK Debug
          DEBUG_APK=$(find ${{ env.PROJ_DIR }} -path "*/build/outputs/apk/debug/*.apk" | head -n 1)
          if [ -n "$DEBUG_APK" ]; then 
            cp "$DEBUG_APK" "./AlfyCleaner-Debug.apk"
          fi

          # Cari APK Release
          RELEASE_APK=$(find ${{ env.PROJ_DIR }} -path "*/build/outputs/apk/release/*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then 
            cp "$RELEASE_APK" "./AlfyCleaner-Release.apk"
          fi

          if [ ! -f "./AlfyCleaner-Debug.apk" ] && [ ! -f "./AlfyCleaner-Release.apk" ]; then 
            echo "Kedua APK gagal dibuat!"; exit 1; 
          fi

      - name: Create Release and Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "APK Build ${{ github.run_number }}"
          # Ini akan mengunggah dua file yang sudah kita rename tadi
          files: |
            ./AlfyCleaner-Debug.apk
            ./AlfyCleaner-Release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
