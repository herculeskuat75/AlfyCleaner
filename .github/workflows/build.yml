name: Build AlfyCleaner APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # KITA TAMBAHKAN BARIS INI AGAR GITHUB MASUK KE FOLDER PROYEK
    defaults:
      run:
        working-directory: ./AlfyCleaner 

    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v4

    - name: 2. Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: 3. Setup Gradle (Tanpa Wrapper)
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: 4. Build Debug APK
      run: gradle assembleDebug

    - name: 5. Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AlfyCleaner-Debug-APK
        # PATH INI JUGA KITA SESUAIKAN
        path: ./AlfyCleaner/app/build/outputs/apk/debug/*.apk 
        retention-days: 7
